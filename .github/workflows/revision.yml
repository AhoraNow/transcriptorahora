name: Revisión

on:
  pull_request:
  push:
    branches: [main]

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tipos
        run: npx tsc --noEmit
      - name: Estilo del código de la sala
        run: npx eslint src/components src/routes src/lib/scribe-fns.ts src/lib/scribe.ts src/lib/team-fns.ts src/lib/transcript.ts src/lib/team.ts src/lib/auth/middleware.ts
      - name: Pruebas
        run: node --experimental-strip-types --test src/lib/app-data/app-data.test.ts src/lib/app-data/readiness-schedule.test.ts src/lib/auth/gate-identity.test.ts src/lib/auth/sign-in-gate.test.ts src/lib/team.test.ts
      - name: Construcción
        run: npx vite build
